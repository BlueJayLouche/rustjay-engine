[package]
name = "rustjay-isf"
version = "0.2.0"
edition = "2024"
description = "ISF (Interactive Shader Format) support for rustjay-engine — GLSL→WGSL transpiler and EffectPlugin adapter"
license = "MIT"
repository = "https://github.com/BlueJayLouche/rustjay-engine"

[dependencies]
rustjay-core = { workspace = true }
wgpu       = { workspace = true }
bytemuck   = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
log        = { workspace = true }
pollster   = { workspace = true }
shaderc    = { version = "0.10", features = ["build-from-source"] }
naga       = { version = "30", features = ["spv-in", "wgsl-out", "wgsl-in"] }

[dev-dependencies]
pollster = { workspace = true }
image    = { workspace = true }