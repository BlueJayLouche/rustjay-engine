[package]
name = "rustjay-io"
version = "0.1.0"
edition = "2024"
description = "Video input and output for rustjay-engine"
license = "MIT"
repository = "https://github.com/BlueJayLouche/rustjay-engine"
keywords = ["vj", "video", "ndi", "syphon", "spout"]
categories = ["graphics", "multimedia::video"]

[dependencies]
rustjay-core  = { workspace = true }
rustjay-ledmap   = { workspace = true, optional = true }
rustjay-lighting = { workspace = true, optional = true }
log           = { workspace = true }
anyhow       = { workspace = true }
wgpu         = { workspace = true }
bytemuck     = { workspace = true }
crossbeam    = { workspace = true }
cpal         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }

# NDI (optional)
grafton-ndi = { version = "3.0", optional = true }

# HAP encoding (optional)
hap-qt = { version = "0.3.0", optional = true }
rayon  = { version = "1", optional = true }

# Webcam (optional)
nokhwa = { version = "0.10", features = ["input-native"], optional = true }

# ffmpeg video decode (optional).
# default-features disabled to drop `device` (libavdevice): we decode files and
# streams, never capture from AV devices. Linking libavdevice also registers
# AVFFrameReceiver/AVFAudioReceiver, which collide with NewTek's NDI HX driver
# (bundled libavdevice-ndi) and trigger duplicate Objective-C class warnings on
# macOS. We only need codec + format + software-scaling (swscale).
ffmpeg-next = { version = "9.0", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-scaling",
] }

[target.'cfg(target_os = "macos")'.dependencies]
syphon-core = { workspace = true }
syphon-wgpu = { workspace = true }
# Zero-copy VideoToolbox import. Versions must match the ones wgpu-hal builds
# against or the MTLTexture types are different types and will not unify.
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat", "MTLResource"] }
objc2-io-surface = "0.3"
wgpu-hal = { version = "30.0", features = ["metal"] }
objc             = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_LibraryLoader",
] }
# Zero-copy Spout input: imports our bridge textures into Vulkan. Resolves to
# the workspace's vendored wgpu-hal, the one wgpu itself runs on.
wgpu-hal = { version = "30.0", features = ["vulkan"] }

[dev-dependencies]
pollster = { workspace = true }
image    = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
v4l = "0.14"

[features]
# NDI loads the proprietary NDI 6 runtime at run time, so it is opt-in (`--features ndi`).
default = ["webcam"]
webcam  = ["nokhwa"]
ndi     = ["grafton-ndi", "rustjay-core/ndi"]
ffmpeg  = ["dep:ffmpeg-next"]
# Encoding HAP clips. Needs `ffmpeg`/`ffprobe` on PATH at runtime.
hap-encode = ["dep:hap-qt", "dep:rayon"]
# Mapped-LED (sACN) output from a ledmap.json.
led     = ["dep:rustjay-ledmap", "dep:rustjay-lighting"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
