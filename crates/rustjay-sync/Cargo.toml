[package]
name = "rustjay-sync"
version = "0.2.0"
edition = "2024"
description = "Sync & timing: Ableton Link, ProDJ Link, MTC"
license = "MIT"
repository = "https://github.com/BlueJayLouche/rustjay-engine"

[features]
default = ["link"]
link = ["dep:rusty_link"]
prodj = ["dep:prodjlink-rs"]
mtc = []

[dependencies]
rustjay-core = { path = "../rustjay-core", version = "0.2.0" }

log = { workspace = true }

rusty_link = { version = "0.4", optional = true }
prodjlink-rs = { package = "rustjay-prodjlink", version = "0.1.0", git = "https://github.com/BlueJayLouche/prodjlink-rs", rev = "b48000ff8c7a0dd09c65c91c584da5063701a19c", optional = true }
