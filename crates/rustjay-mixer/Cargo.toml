[package]
name = "rustjay-mixer"
version = "0.1.0"
edition = "2024"
description = "Multi-channel compositing mixer for rustjay-engine (Phase B3)"
license = "MIT"
repository = "https://github.com/BlueJayLouche/rustjay-engine"
keywords = ["vj", "video", "mixer", "compositing", "wgpu"]
categories = ["graphics", "multimedia::video"]

[dependencies]
rustjay-core   = { workspace = true }
rustjay-render = { workspace = true }
wgpu           = { workspace = true }
bytemuck       = { workspace = true }
log            = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
uuid           = { workspace = true }

[dev-dependencies]
# WGSL front-end only, for the shader-validation test (no GPU required).
naga = { version = "30", features = ["wgsl-in"] }
pollster = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Not used in code: a direct dependency is what makes syphon-core's
# `links = "Syphon"` metadata (DEP_SYPHON_FRAMEWORK_DIR) visible to build.rs,
# which needs it to emit the runtime rpath for the bundled Syphon.framework.
syphon-core = { workspace = true }
