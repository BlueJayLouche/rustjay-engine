[package]
name = "kovvboj"
version = "0.1.0"
edition = "2024"

[features]
default = ["mixer", "egui", "webcam", "led"]
mixer = ["rustjay-engine/mixer", "dep:rustjay-mixer"]
webcam = ["rustjay-engine/webcam", "rustjay-io/webcam"]
led = ["rustjay-io/led"]
api = ["rustjay-engine/api", "dep:rustjay-api"]
egui = ["rustjay-engine/egui", "dep:egui", "dep:rustjay-gui", "rustjay-gui/egui"]
projection = ["rustjay-engine/projection", "dep:rustjay-projection", "rustjay-projection/surface-import"]
ndi = ["rustjay-engine/ndi", "rustjay-io/ndi"]
link = ["rustjay-engine/link"]
prodj = ["rustjay-engine/prodj"]
syphon = []
streaming = []
recording = []
hap = ["dep:hap-wgpu"]
ffmpeg = ["rustjay-io/ffmpeg"]
sysmon = ["dep:sysinfo"]
# Laser decks: MadMapper laser materials rendered to 2D paths. Off by default —
# `laser` is the pipeline and preview, `laser-dac` adds hardware output, which
# pulls in libusb and CMake.
laser = ["dep:rustjay-laser"]
laser-dac = ["laser", "rustjay-laser/dac"]

[dependencies]
rustjay-engine = { workspace = true }
rustjay-gui    = { workspace = true, optional = true }
uuid           = { workspace = true }
rustjay-mixer  = { workspace = true, optional = true }
rustjay-isf    = { workspace = true }
isf            = { workspace = true }
rustjay-core   = { workspace = true }
rustjay-render = { workspace = true }
rustjay-io     = { workspace = true }
rustjay-api    = { workspace = true, optional = true }
rustjay-projection = { workspace = true, optional = true }
rustjay-lighting   = { workspace = true }
rustjay-ledmap     = { workspace = true }
wgpu           = { workspace = true }
bytemuck       = { workspace = true }
anyhow         = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
log            = { workspace = true }
env_logger     = "0.11"
image          = { workspace = true }
notify         = "8.0"
rustjay-laser  = { path = "../rustjay-laser", optional = true }
rfd            = "0.15"
egui           = { workspace = true, optional = true }
winit          = { workspace = true }
hap-wgpu       = { version = "0.3.0", optional = true }
sysinfo        = { version = "0.34", optional = true, default-features = false, features = ["system"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.1", features = ["snapshot", "wgpu"] }
