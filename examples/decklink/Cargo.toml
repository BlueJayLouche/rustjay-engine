[package]
name = "decklink-input"
version = "0.1.0"
publish = false
edition = "2024"
description = "Blackmagic DeckLink input example for rustjay-engine"

[dependencies]
rustjay-core   = { workspace = true }
bytemuck       = { workspace = true }
log            = { workspace = true }
wgpu           = { workspace = true }

# Only the Windows `main` (DeckLink SDK) uses these.
[target.'cfg(windows)'.dependencies]
rustjay-engine = { workspace = true }
env_logger     = "0.11"
anyhow         = { workspace = true }
crossbeam      = { workspace = true }

[build-dependencies]
cc = "1.0"
