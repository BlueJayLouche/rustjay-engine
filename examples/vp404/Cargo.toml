[package]
name = "vp404"
version = "0.1.0"
edition = "2021"
description = "VP-404 — SP-404-style video sampler (port of rustjay-404)."

[features]
default = ["egui", "mixer"]
egui    = ["rustjay-engine/egui"]
mixer   = ["rustjay-engine/mixer", "dep:rustjay-mixer"]
# Live sampling pulls in rustjay-io capture (webcam / platform Syphon/Spout).
# Keep it off the default build so headless/Pi builds stay lean.
capture = ["rustjay-io/webcam"]
# Push param values (pad<i>_loaded, rec_state, ...) to an OSC controller.
osc-feedback = ["rustjay-engine/osc-feedback"]
ndi     = ["rustjay-engine/ndi"]
# Ableton Link tempo sync (sync-source picker + Link panel in the Audio tab).
link    = ["rustjay-engine/link"]
# REST/WebSocket API layer + browser pad-grid page.
# Gate off by default so the base build stays lean (no tokio/axum/utoipa).
api     = ["rustjay-engine/api"]

[dependencies]
rustjay-engine = { workspace = true }
rustjay-mixer  = { workspace = true, optional = true }
rustjay-core   = { workspace = true }
# HAP encoding lives here now (the pad grid converts clips on import).
rustjay-io     = { workspace = true, default-features = false, features = ["hap-encode"] }
wgpu           = { workspace = true }
egui           = { workspace = true }
hap-wgpu       = "0.3.0"
anyhow         = { workspace = true }
log            = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
bytemuck       = { version = "1.14", features = ["derive"] }
env_logger     = "0.11"
rfd            = "0.15"
