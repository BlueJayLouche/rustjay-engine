[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BlueJayLouche/rustjay-engine"
rust-version = "1.97"

[workspace.dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
log = "0.4"
rust_decimal = { version = "1.36", features = ["serde"] }
flate2 = "1"
roxmltree = "0.20"

# Audio / Video
cpal = "0.18.1"
rubato = "0.16"
symphonia = { version = "0.6", features = ["all"] }
ffmpeg-next = "8.1"
hap-parser = "0.2.0"

# GPU / UI
# frame-pacing-diag is a fork-only feature (see [patch.crates-io]): fence-lock
# timing for the Help → Status "Frame Pacing (wgpu)" section, built for the
# #139 delivery-stall investigation. Trivial overhead; kept on in field builds.
wgpu = { version = "30.0", features = ["frame-pacing-diag"] }
winit = "0.30"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
eframe = "0.36"
pollster = "0.3"

# Networking / Protocols
rosc = "0.11"
tokio = { version = "1.42", features = ["rt-multi-thread", "sync", "net", "time", "fs"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
utoipa = "5.5"

# MIDI
midir = "0.11"

# Threading / Sync
crossbeam = "0.8"

# Utils
bitflags = "2.9"
chrono = { version = "0.4", features = ["serde", "std", "clock"] }
dirs = "6.0"
rfd = "0.15"
brotli = "7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Engine crates, consumed from crates.io — CuePool's last code tie to the
# engine tree. Local edits to crates/rustjay-lighting no longer reach CuePool
# until published; bump the version here to pick them up.
rustjay-lighting = "0.1.0"

# Internal crates (path deps managed by cargo workspace)
cuepool-core = { path = "crates/cuepool-core" }
cuepool-audio = { path = "crates/cuepool-audio" }
cuepool-gui = { path = "crates/cuepool-gui" }
cuepool-video = { path = "crates/cuepool-video" }
cuepool-protocols = { path = "crates/cuepool-protocols" }
cuepool = { path = "crates/cuepool" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# TEMPORARY local-path pin of the wgpu-30 fork branch cuepool/frame-pacing-diag-30
# (commit 0316ceebc): the PC02 PAT cannot push to scroix/wgpu yet. MUST be
# flipped to the scroix/wgpu git rev before this branch is pushed for PR/CI.
[patch.crates-io]
wgpu = { path = "C:/Users/APAdmin/AppData/Local/Temp/claude/C--Users-APAdmin-sandbox-rustjay-engine--claude-worktrees-cuepool-d3d12va-wgpu-b8ece0/1fae24c1-8bc3-4d2b-91a5-3c35d6da443b/scratchpad/wgpu-fork/wgpu" }
wgpu-core = { path = "C:/Users/APAdmin/AppData/Local/Temp/claude/C--Users-APAdmin-sandbox-rustjay-engine--claude-worktrees-cuepool-d3d12va-wgpu-b8ece0/1fae24c1-8bc3-4d2b-91a5-3c35d6da443b/scratchpad/wgpu-fork/wgpu-core" }
wgpu-hal = { path = "C:/Users/APAdmin/AppData/Local/Temp/claude/C--Users-APAdmin-sandbox-rustjay-engine--claude-worktrees-cuepool-d3d12va-wgpu-b8ece0/1fae24c1-8bc3-4d2b-91a5-3c35d6da443b/scratchpad/wgpu-fork/wgpu-hal" }
