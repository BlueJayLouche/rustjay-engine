[package]
name = "cuepool-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Dev-only test harness. Deliberately does NOT depend on cuepool-video or
# cuepool-gui: those need FFmpeg/wgpu and cannot link on a headless box.
[dependencies]
cuepool-core.workspace = true
cuepool-audio = { workspace = true, features = ["test-harness"] }
cuepool-protocols.workspace = true
rosc.workspace = true
serde_json.workspace = true
