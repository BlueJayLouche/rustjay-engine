[package]
name = "cuepool-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Dev-only test harness. Video is decoded through FFmpeg but never presented,
# so the runner still needs no window, GPU, or audio device.
[dependencies]
cuepool = { workspace = true, features = ["test-harness"] }
cuepool-core.workspace = true
cuepool-audio = { workspace = true, features = ["test-harness"] }
cuepool-protocols.workspace = true
cuepool-video.workspace = true
anyhow.workspace = true
rust_decimal.workspace = true
rosc.workspace = true
serde_json.workspace = true
