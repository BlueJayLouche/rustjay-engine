name: Release Apps

# Builds + packages the flagship example apps and attaches them to a GitHub release.
#   macOS  -> .app bundle in a .dmg (ad-hoc signed)
#   Windows -> portable .zip + .msi installer (WiX, Start-menu shortcut)
#   Linux  -> .tar.gz
#
# Trigger: push a tag like `apps-v0.1.0`, or run manually (workflow_dispatch).
# The tag groups app releases; each package's version comes from its Cargo manifest.
# A manual run builds from the dispatched ref; pick a single app to skip the rest
# of the matrix. With `release_tag` empty it's a dry run (artifacts only); set it
# to an existing apps-v* tag to re-release — same-name assets on that release are
# replaced.
#
# Per-app icon slots — dropped-in files are picked up automatically:
#   examples/<app>/packaging/AppIcon.icns  -> macOS bundle icon
#   examples/<app>/packaging/icon.ico      -> Windows Start-menu shortcut icon
# (Embedding the .ico into the .exe itself needs a winresource build.rs per app —
#  not done yet.)
#
# Apps build with --all-features (NDI, Link, Pro DJ Link, HAP, API, ffmpeg…);
# the NDI SDK is fetched per-OS and its runtime lib ships inside the packages.
# Adding an app = one entry in matrix.app + optionally one include entry for
# metadata (display name, nested manifest, ffmpeg/ndi bundling flags).

on:
  push:
    tags: ["apps-v*"]
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (all = full matrix)"
        type: choice
        options: [all, cuepool, vjarda, vp404, shaderglass, videowall]
        default: all
      release_tag:
        description: "Existing apps-v* tag to attach the packages to (empty = artifacts-only dry run)"
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The whole matrix (app list + per-app include metadata + excludes) is built
  # here so a single-app dispatch can filter ALL of it: a plain fromJSON filter
  # on matrix.app alone would orphan the static include entries into os-less
  # jobs, and job-level `if` can't see the matrix context.
  plan:
    name: Plan matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          APP: ${{ inputs.app || 'all' }}
        run: |
          cat > matrix.json <<'JSON'
          {
            "os": ["macos-latest", "ubuntu-latest", "windows-latest"],
            "app": ["cuepool", "vjarda", "vp404", "shaderglass", "videowall"],
            "include": [
              {"app": "cuepool", "display": "CuePool",
               "manifest": "--manifest-path examples/cuepool/Cargo.toml",
               "target_dir": "examples/cuepool/target", "ffmpeg": true,
               "file_ext": "qproj"},
              {"app": "vjarda", "ffmpeg": true, "ndi": true},
              {"app": "vp404", "display": "VP-404", "ndi": true},
              {"app": "shaderglass", "display": "ShaderGlass", "ndi": true},
              {"app": "videowall", "display": "VideoWall", "ndi": true}
            ],
            "exclude": [
              {"os": "ubuntu-latest", "app": "cuepool"}
            ]
          }
          JSON
          # Notes carried over from the old inline matrix:
          #  - vjarda: --all-features enables its ffmpeg feature
          #  - exclude: cuepool's FFmpeg closure is untested on Linux
          if [ "$APP" != "all" ]; then
            jq -c --arg app "$APP" \
              '.app = [$app]
               | .include = [.include[] | select(.app == $app)]
               | .exclude = [.exclude[] | select(.app == $app)]' \
              matrix.json > filtered.json && mv filtered.json matrix.json
          fi
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }} / ${{ matrix.os }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.app != 'cuepool'

      - uses: dtolnay/rust-toolchain@1.97.1
        if: matrix.app == 'cuepool'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.app }}
          workspaces: |
            .
            examples/cuepool

      # The engine's macOS build scripts hunt for Syphon.framework (the
      # published syphon-core crate ships it flattened, which the linker can't
      # use). The syphon-rs repo commits the real framework — clone it and
      # point SYPHON_FRAMEWORK_DIR at it; packaging bundles it from here too.
      - name: Get Syphon.framework (macOS)
        if: runner.os == 'macOS'
        run: |
          git clone --depth 1 https://github.com/BlueJayLouche/syphon-rs "$RUNNER_TEMP/syphon-rs"
          echo "SYPHON_FRAMEWORK_DIR=$RUNNER_TEMP/syphon-rs/syphon-lib" >> "$GITHUB_ENV"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config clang ninja-build \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          # $ORIGIN rpath so bundled shared libs (libndi) load from next to the binary
          echo 'RUSTFLAGS=-C link-arg=-Wl,-rpath,$ORIGIN' >> "$GITHUB_ENV"

      # NDI SDK: proprietary, fetched from NDI's public download URLs; the
      # runtime library is redistributed inside the packages (attribution in
      # the release notes, per the NDI SDK license).
      - name: Install NDI SDK (macOS)
        if: runner.os == 'macOS' && matrix.ndi
        run: |
          curl -L -o "$RUNNER_TEMP/ndi.pkg" "https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg"
          sudo installer -pkg "$RUNNER_TEMP/ndi.pkg" -target /
          echo "NDI_SDK_DIR=/Library/NDI SDK for Apple" >> "$GITHUB_ENV"

      - name: Install NDI SDK (Linux)
        if: runner.os == 'Linux' && matrix.ndi
        run: |
          curl -L -o "$RUNNER_TEMP/ndi.tar.gz" "https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz"
          tar -xzf "$RUNNER_TEMP/ndi.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          yes | PAGER=cat sh Install_NDI_SDK_v6_Linux.sh > /dev/null
          echo "NDI_SDK_DIR=$RUNNER_TEMP/NDI SDK for Linux" >> "$GITHUB_ENV"

      - name: Install NDI SDK (Windows)
        if: runner.os == 'Windows' && matrix.ndi
        timeout-minutes: 10
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\ndi_sdk.exe" "https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe"
          # The installer is Inno Setup and pops a dialog even in silent mode
          # (hung earlier runs) — don't run it, unpack its payload instead.
          choco install innoextract -y --no-progress | Out-Null
          innoextract "$env:RUNNER_TEMP\ndi_sdk.exe" -d "$env:RUNNER_TEMP\ndi-sdk" | Out-Null
          $inc = Get-ChildItem "$env:RUNNER_TEMP\ndi-sdk" -Recurse -Directory -Filter Include | Select-Object -First 1
          if (-not $inc) { throw "NDI SDK: innoextract found no Include dir" }
          "NDI_SDK_DIR=$($inc.Parent.FullName)" >> $env:GITHUB_ENV

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS' && matrix.ffmpeg
        run: brew install ffmpeg dylibbundler

      - name: Install FFmpeg SDK (Windows)
        if: runner.os == 'Windows' && matrix.ffmpeg
        shell: pwsh
        run: |
          # pinned to n8.1 — ffmpeg-next can't compile against master's moving API
          curl.exe -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip"
          Expand-Archive ffmpeg.zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          "FFMPEG_DIR=$($dir.FullName)" >> $env:GITHUB_ENV

      # apriltag (videowall feature) is pthread-only; MSVC needs the vcpkg
      # pthreads shim. Same dance as ci.yml's rust-windows job.
      - name: Cache vcpkg pthreads
        if: runner.os == 'Windows' && matrix.app == 'videowall'
        id: vcpkg-cache
        uses: actions/cache@v6
        with:
          path: C:\vcpkg\installed
          key: vcpkg-pthreads-x64-windows-static-md-v1
      - name: Install pthreads shim for apriltag
        if: runner.os == 'Windows' && matrix.app == 'videowall' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        run: vcpkg install pthreads:x64-windows-static-md
      - name: Point apriltag-sys at the pthread shim
        if: runner.os == 'Windows' && matrix.app == 'videowall'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md"
          "APRILTAG_SYS_WINDOWS_PTHREAD_INCLUDE_DIR=$vcpkg\include"           >> $env:GITHUB_ENV
          "APRILTAG_SYS_WINDOWS_PTHREAD_STATIC_LIB=$vcpkg\lib\pthreadVC3.lib" >> $env:GITHUB_ENV

      - name: Build identity from Cargo and Git
        shell: bash
        run: |
          package_id="$(cargo pkgid ${{ matrix.manifest }} -p ${{ matrix.app }})"
          echo "VERSION=${package_id##*#}" >> "$GITHUB_ENV"
          echo "CUEPOOL_BUILD_ID=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked ${{ matrix.manifest }} -p ${{ matrix.app }} --all-features

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          DISPLAY_NAME="${{ matrix.display || matrix.app }}"
          TD="${{ matrix.target_dir || 'target' }}"
          APP="dist/$DISPLAY_NAME.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" out
          cp "$TD/release/${{ matrix.app }}" "$APP/Contents/MacOS/"
          ICNS="examples/${{ matrix.app }}/packaging/AppIcon.icns"
          [ -f "$ICNS" ] && cp "$ICNS" "$APP/Contents/Resources/"
          sed -e "s/__NAME__/$DISPLAY_NAME/g" \
              -e "s/__BIN__/${{ matrix.app }}/g" \
              -e "s/__VERSION__/$VERSION/g" \
              .github/packaging/Info.plist.tmpl > "$APP/Contents/Info.plist"
          BIN="$APP/Contents/MacOS/${{ matrix.app }}"
          # Bundle Syphon.framework for binaries that link it (loaded via @rpath).
          if otool -L "$BIN" | grep -q Syphon.framework; then
            mkdir -p "$APP/Contents/Frameworks"
            cp -R "$SYPHON_FRAMEWORK_DIR/Syphon.framework" "$APP/Contents/Frameworks/"
          fi
          # Bundle the NDI runtime (install name @rpath/libndi.dylib).
          if [ "${{ matrix.ndi }}" = "true" ]; then
            mkdir -p "$APP/Contents/Frameworks"
            cp "$NDI_SDK_DIR/lib/macOS/libndi.dylib" "$APP/Contents/Frameworks/"
          fi
          if [ "${{ matrix.ffmpeg }}" = "true" ]; then
            # pull the brew FFmpeg dylib closure into the bundle and rewrite load paths
            dylibbundler -cd -od -b -x "$BIN" \
              -d "$APP/Contents/libs/" -p @executable_path/../libs/
          fi
          # Normalize rpaths: dylibbundler rewrites every existing rpath to its
          # -p value (leaving duplicates that macOS 26+ dyld refuses to load),
          # and shipped apps shouldn't carry build-machine paths anyway.
          # Strip everything, then add the one rpath the bundle needs.
          otool -l "$BIN" | awk '/LC_RPATH/{getline; getline; print $2}' | while read -r rp; do
            install_name_tool -delete_rpath "$rp" "$BIN" 2>/dev/null || true
          done
          install_name_tool -add_rpath @executable_path/../Frameworks "$BIN"
          codesign --force --deep -s - "$APP"
          hdiutil create -volname "$DISPLAY_NAME" -srcfolder "$APP" -ov -format UDZO \
            "out/${{ matrix.app }}-macos-arm64.dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          TD="${{ matrix.target_dir || 'target' }}"
          mkdir -p out stage
          cp "$TD/release/${{ matrix.app }}" stage/
          if [ "${{ matrix.ndi }}" = "true" ]; then
            # ship the NDI runtime next to the binary ($ORIGIN rpath)
            cp -P "$NDI_SDK_DIR"/lib/x86_64-linux-gnu/libndi.so* stage/
          fi
          tar -C stage -czf "out/${{ matrix.app }}-linux-x86_64.tar.gz" .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = '${{ matrix.app }}'
          $display = '${{ matrix.display || matrix.app }}'
          $td = '${{ matrix.target_dir || 'target' }}'
          $dist = "dist\$app"
          New-Item -ItemType Directory -Force $dist, out | Out-Null
          Copy-Item "$td\release\$app.exe" $dist
          if ('${{ matrix.ffmpeg }}' -eq 'true') {
            Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $dist
          }
          if ('${{ matrix.ndi }}' -eq 'true') {
            Copy-Item "$env:NDI_SDK_DIR\Bin\x64\Processing.NDI.Lib.x64.dll" $dist
          }
          Compress-Archive -Path "$dist\*" -DestinationPath "out\$app-windows-x86_64.zip"
          # Optional Explorer file association (e.g. .qproj -> CuePool).
          # Hashtable splat: array splats bind positionally, which assigns the
          # '-FileExt' string itself to the FileExt slot and errors on its value.
          $extArgs = @{}
          if ('${{ matrix.file_ext }}') { $extArgs['FileExt'] = '${{ matrix.file_ext }}' }
          .github\scripts\make-msi.ps1 -Name $display -Version $env:VERSION `
            -SourceDir $dist -Exe "$app.exe" `
            -Icon "examples\$app\packaging\icon.ico" `
            -Out "out\$app-windows-x86_64.msi" @extArgs

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.app }}-${{ matrix.os }}
          path: out/*

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/apps-v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Apps are built with all features (NDI, Ableton Link, Pro DJ Link, HAP, REST API, …).
            The NDI runtime is bundled. NDI® is a registered trademark of Vizrt NDI AB.
            Linux builds link the distro's FFmpeg (`libavcodec`/`libavformat`/`libswscale`) — install via your package manager.

            **macOS**: apps are ad-hoc signed, not notarized. On first launch macOS will block them:
            right-click → Open, or approve under System Settings → Privacy & Security, or
            `xattr -dr com.apple.quarantine "/Applications/<App>.app"`.
          files: artifacts/**/*
