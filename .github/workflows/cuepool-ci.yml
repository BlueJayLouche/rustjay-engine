name: CuePool CI

on:
  push:
    branches: [main]
    paths:
      - "examples/cuepool/**"
      - ".github/workflows/cuepool-ci.yml"
  pull_request:
    paths:
      - "examples/cuepool/**"
      - ".github/workflows/cuepool-ci.yml"

concurrency:
  group: cuepool-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cuepool:
    name: CuePool (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cuepool
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libasound2-dev libudev-dev pkg-config clang ninja-build \
            mesa-vulkan-drivers libvulkan1 \
            libavcodec-dev libavformat-dev libavutil-dev \
            libavfilter-dev libavdevice-dev libswscale-dev libswresample-dev
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/cuepool
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  cuepool-mcp:
    name: CuePool MCP (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/cuepool/mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: examples/cuepool/mcp/package-lock.json
      - run: npm ci
      - run: npm test
