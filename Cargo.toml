[workspace]
members = [
    "crates/rustjay-core",
    "crates/rustjay-audio",
    "crates/rustjay-io",
    "crates/rustjay-control",
    "crates/rustjay-presets",
    "crates/rustjay-gui",
    "crates/rustjay-render",
    "crates/rustjay-mixer",
    "crates/rustjay-engine",
    "crates/rustjay-sync",
    "crates/rustjay-isf",
    "crates/rustjay-api",
    "crates/rustjay-projection",
    "crates/rustjay-lighting",
    "crates/rustjay-ledmap",
    "crates/rustjay-laser",
    "crates/ledmap-studio",
    "examples/template",
    "examples/delta",
    "examples/waaaves",
    "examples/sputnik",
    "examples/flux",
    "examples/webapp",
    "examples/isf-example",
    "examples/delta-egui",
    "examples/mixer",
    "examples/projection",
    "examples/decklink",
    "examples/videowall",
    "examples/vp404",
]
resolver = "3"

[workspace.dependencies]
# Core utilities
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
log         = "0.4"
anyhow      = "1.0"
thiserror   = "2.0"
flate2      = "1"

# GPU / windowing
wgpu        = { version = "30.0", features = ["spirv", "gles"] }
winit       = "0.30"
raw-window-handle = "0.6"
pollster    = "1.0"
bytemuck    = { version = "1.21", features = ["derive"] }
glam        = { version = "0.34", features = ["bytemuck", "serde"] }
image       = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc   = { version = "0.27", default-features = false }
earcutr     = "0.5"
glow        = "0.17"  # ponytail: must match wgpu-hal 30's glow (GLES interop); bump with wgpu
khronos-egl = { version = "6", features = ["dynamic"] }

# GUI
imgui               = "0.12"
# ponytail: upstream master has wgpu 30 but no release yet; back to plain "0.29" once it ships.
imgui-wgpu          = { package = "rustjay-imgui-wgpu", path = "vendor/imgui-wgpu", version = "0.28.0" }
imgui-winit-support = "0.13"
# 0.37 made default_fonts opt-in and split the symbol fonts (⚙ ✖ …) into
# monochrome_emoji_fonts; these two restore 0.36's font set. Without them text panics.
egui                = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-wgpu           = "0.37"
egui-winit          = "0.37"

# Audio
cpal    = "0.18"
rustfft = "6.2"
realfft = "3.4"

# Async / threading
tokio     = { version = "1.42", features = ["rt-multi-thread", "sync", "net"] }
crossbeam = "0.8"

# Control protocols
midir = "0.11"
rosc  = "0.11"

# Web server
axum       = { version = "0.8", features = ["ws"] }

# Config / serialisation helpers
dirs    = "7.0"
rand    = "0.10"
qrcode  = "0.15"
uuid    = { version = "1", features = ["v4"] }

# Workspace-internal crates
rustjay-core    = { path = "crates/rustjay-core", version = "0.1.0" }
rustjay-audio   = { path = "crates/rustjay-audio", version = "0.1.0" }
rustjay-io      = { path = "crates/rustjay-io",      version = "0.1.0", default-features = false }
rustjay-control = { path = "crates/rustjay-control", version = "0.1.0" }
rustjay-presets = { path = "crates/rustjay-presets", version = "0.1.0" }
rustjay-gui     = { path = "crates/rustjay-gui",     version = "0.1.0" }
rustjay-render  = { path = "crates/rustjay-render",  version = "0.1.0" }
rustjay-mixer   = { path = "crates/rustjay-mixer",   version = "0.1.0" }
rustjay-engine  = { path = "crates/rustjay-engine",  version = "0.1.0", default-features = false }
rustjay-isf     = { path = "crates/rustjay-isf",     version = "0.1.0" }
rustjay-api     = { path = "crates/rustjay-api",     version = "0.1.0" }
rustjay-projection = { path = "crates/rustjay-projection", version = "0.1.0" }
rustjay-lighting   = { path = "crates/rustjay-lighting",   version = "0.1.0" }
rustjay-ledmap     = { path = "crates/rustjay-ledmap",     version = "0.1.0" }
syphon-core     = "0.4.0"
syphon-wgpu     = "0.4.3"

[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }
nokhwa-bindings-macos = { path = "vendor/nokhwa-bindings-macos" }

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "unwind"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1
